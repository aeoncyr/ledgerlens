[project]
name = "ledgerlens-api"
version = "0.1.0"
description = "LedgerLens backend: FastAPI app and the evidence-reading agents"
requires-python = ">=3.12"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.ruff.lint.per-file-ignores]
# Shared verbatim with the integrations work; its first docstring line is one character long.
"app/events.py" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
