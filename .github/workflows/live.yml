name: Live site check

# Judging runs on the live site from Oct 19 to Nov 6 with no retries for outages, so check it every six
# hours. A failed run emails whoever last changed this schedule.
on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

jobs:
  check:
    name: Check the live site and API
    runs-on: ubuntu-latest
    env:
      SITE: https://ledger-lens-511708.web.app
    steps:
      - name: Landing page
        run: curl --fail --silent --show-error --max-time 20 "$SITE/" | grep -q "<title>"
      - name: API health through Hosting
        run: |
          body=$(curl --fail --silent --show-error --max-time 30 "$SITE/api/health")
          echo "$body"
          echo "$body" | grep -q '"ok":true'
      - name: App routes
        run: |
          for path in /owner /app /ai /samples/pak-hendra; do
            curl --fail --silent --show-error --max-time 20 -o /dev/null "$SITE$path"
          done
      - name: Sample files open without the API
        run: |
          for slug in bu-sari pak-joko pak-hendra bu-wati; do
            curl --fail --silent --show-error --max-time 20 "$SITE/samples/$slug/file.json" \
              | python3 -c "import json, sys; f = json.load(sys.stdin); assert f['evidence'], 'no evidence'"
          done
